default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages:
  - pre-commit
  - manual
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--output-format, github, --fix]
      - id: ruff-format
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.29
    hooks:
      - id: pymarkdown
        args: [fix]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/lk16/detect-missing-init
    rev: v0.1.6
    hooks:
      - id: detect-missing-init
        args: [--create, --track, --python-folders, src/vllm_omni_torchtpu]
  # Keeps the lines inside each keep-sorted block in sorted order.
  - repo: https://github.com/google/keep-sorted
    rev: v0.10.0
    hooks:
      - id: keep-sorted
  - repo: local
    hooks:
      - id: signoff-commit
        name: Sign-off Commit
        entry: bash
        args:
          - -c
          - |
            if ! grep -q "^Signed-off-by: $(git config user.name) <$(git config user.email)>" "$(git rev-parse --git-path COMMIT_EDITMSG)"; then
              printf "\nSigned-off-by: $(git config user.name) <$(git config user.email)>\n" >> "$(git rev-parse --git-path COMMIT_EDITMSG)"
            fi
        language: system
        verbose: true
        stages: [commit-msg]
      - id: check-license-headers
        name: Source files carry the full Apache 2.0 license header
        # The open-source release scanner fails a source file without the full
        # Apache 2.0 header text, and an SPDX-License-Identifier tag makes it
        # ignore that text even when present, so the tag is not an alternative.
        # Covers shell, YAML and proto as well as Python. `--fix` inserts the
        # header, drops the tag, and keeps a copyright notice the file already
        # carries, so upstream-derived files keep their attribution. Empty files
        # pass, so a bare __init__.py does.
        entry: tools/check_license_headers.py
        args: [--fix]
        language: script
        types: [text]
      - id: check-filenames
        name: Check for spaces in all filenames
        entry: bash
        args:
          - -c
          - 'git ls-files | grep " " && echo "Filenames should not contain spaces!" && exit 1 || exit 0'
        language: system
        always_run: true
        pass_filenames: false
      - id: no-internal-refs
        name: No internal links, bug numbers or source paths
        # The repo is public, so internal links, bug and change numbers, and
        # internal source paths mean nothing to most readers. Put the reasoning in
        # the comment or cite a public source. A link must start a word or follow
        # http:// or https://, so paths such as /usr/local/go/bin pass.
        entry: '(^|[\s(\[{"''`<,]|https?://)(go/[A-Za-z]|b/[0-9]{6,}|cl/[0-9]{6,})|\bgoogle3\b'
        language: pygrep
        types: [text]
      - id: suggestion
        name: Suggestion
        entry: bash -c 'echo "To bypass pre-commit hooks, add --no-verify to git commit."'
        language: system
        verbose: true
        pass_filenames: false
